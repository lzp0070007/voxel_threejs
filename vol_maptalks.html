<!DOCTYPE html>
<html>
  <head>
    <title>volume Rendering</title>
    <script
      type="text/javascript"
      src="https://unpkg.com/dat.gui@0.7.6/build/dat.gui.min.js"
    ></script>
    <link type="text/css" rel="stylesheet" href="https://unpkg.com/maptalks/dist/maptalks.css" />
    <script type="text/javascript" src="https://unpkg.com/maptalks/dist/maptalks.js"></script>
    <script type="text/javascript" src="https://unpkg.com/@maptalks/gl/dist/maptalksgl.js"></script>
    <script
      type="text/javascript"
      src="https://unpkg.com/three@0.138.0/build/three.min.js"
    ></script>
    <script
      type="text/javascript"
      src="https://unpkg.com/maptalks.three@latest/dist/maptalks.three.js"
    ></script>
    <script
      type="text/javascript"
      src="https://unpkg.com/dat.gui@0.7.6/build/dat.gui.min.js"
    ></script>
    <script type="text/javascript" src="https://unpkg.com/jszip@3.10.1/dist/jszip.min.js"></script>
    <script
      type="text/javascript"
      src="https://unpkg.com/three@0.138.0/examples/js/libs/stats.min.js"
    ></script>
    <style>
      html,
      body {
        margin: 0px;
        height: 100%;
        width: 100%;
      }

      #map {
        width: 100%;
        height: 100%;
        background-color: #000;
      }
    </style>
  </head>

  <body>
    <div id="map"></div>
    <script>
      const map = new maptalks.Map('map', {
        cameraInfiniteFar: true,
        center: [117.11166992, 31.740632159999997],
        zoom: 17,
        pitch: 60,
        maxVisualPitch:90,
        centerCross: true,
        doubleClickZoom: false,
        baseLayer: new maptalks.TileLayer('tile', {
          urlTemplate: 'http://wprd01.is.autonavi.com/appmaptile?x={x}&y={y}&z={z}&lang=zh_cn&size=1&scl=1&style=6',
        }),
      });

      class Volume extends maptalks.BaseObject {
        constructor({ coordinate, resolution, data, altitude }, options, layer) {
          options = maptalks.Util.extend({}, options, { layer, coordinate });
          super();
          //Initialize internal configuration
          // https://github.com/maptalks/maptalks.three/blob/1e45f5238f500225ada1deb09b8bab18c1b52cf2/src/BaseObject.js#L135
          this._initOptions(options);

          const texture = new THREE.Data3DTexture(data, resolution.x, resolution.y, resolution.z);
          texture.format = THREE.RGBAFormat;
          texture.type = THREE.FloatType;
          texture.minFilter = THREE.NearestFilter;
          texture.magFilter = THREE.NearestFilter;
          texture.unpackAlignment = 1;
          texture.needsUpdate = true;

          const geometry = new THREE.BoxGeometry(
            resolution.x * 1,
            resolution.y * 1,
            resolution.z * 1,
          );

          const material = new THREE.RawShaderMaterial({
            glslVersion: THREE.GLSL3,
            uniforms: {
              volume: { value: texture },
              threshold: { value: 0.8 },
              steps: { value: 1000 },
            },
            vertexShader: `layout(location=0) in vec3 position;
        uniform mat4 modelViewMatrix;
        uniform mat4 projectionMatrix;
        uniform mat4 viewMatrix;
        uniform mat4 modelMatrix;
        uniform vec3 cameraPosition;

        out vec3 v_modelPos;
        out vec3 v_origin;
      out vec3 v_direction;

        void main(void) {
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          v_modelPos = (modelMatrix * vec4(position, 1.0)).xyz;

          v_origin = vec3(inverse(modelMatrix) * vec4(cameraPosition, 1.0)).xyz;
        v_direction = position - v_origin;
        }
          `,
            fragmentShader: `precision highp int;
        precision highp float;
        uniform highp sampler3D volume;
        uniform vec3 cameraPosition;
        uniform float threshold;
      uniform float steps;

        in vec3 v_modelPos;
        in vec3 v_origin;
      in vec3 v_direction;
        out vec4 color;

        vec2 hitBox( vec3 orig, vec3 dir ) {
          const vec3 box_min = vec3( - 0.5 );
          const vec3 box_max = vec3( 0.5 );
          vec3 inv_dir = 1.0 / dir;
          vec3 tmin_tmp = ( box_min - orig ) * inv_dir;
          vec3 tmax_tmp = ( box_max - orig ) * inv_dir;
          vec3 tmin = min( tmin_tmp, tmax_tmp );
          vec3 tmax = max( tmin_tmp, tmax_tmp );
          float t0 = max( tmin.x, max( tmin.y, tmin.z ) );
          float t1 = min( tmax.x, min( tmax.y, tmax.z ) );
          return vec2( t0, t1 );
        }

        float sample1(vec3 p) {
          return texture(volume, p).r;
        }

        vec4 sample2(vec3 p) {
          return texture(volume, p);
        }

        float linear_to_srgb(float x) {
          if (x <= 0.0031308f) {
              return 12.92f * x;
          }
          return 1.055f * pow(x, 1.f / 2.4f) - 0.055f;
        }

        #define epsilon .0001

        vec3 normal( vec3 coord ) {
          if ( coord.x < epsilon ) return vec3( 1.0, 0.0, 0.0 );
          if ( coord.y < epsilon ) return vec3( 0.0, 1.0, 0.0 );
          if ( coord.z < epsilon ) return vec3( 0.0, 0.0, 1.0 );
          if ( coord.x > 1.0 - epsilon ) return vec3( - 1.0, 0.0, 0.0 );
          if ( coord.y > 1.0 - epsilon ) return vec3( 0.0, - 1.0, 0.0 );
          if ( coord.z > 1.0 - epsilon ) return vec3( 0.0, 0.0, - 1.0 );

          float step = 0.01;
          float x = sample1( coord + vec3( - step, 0.0, 0.0 ) ) - sample1( coord + vec3( step, 0.0, 0.0 ) );
          float y = sample1( coord + vec3( 0.0, - step, 0.0 ) ) - sample1( coord + vec3( 0.0, step, 0.0 ) );
          float z = sample1( coord + vec3( 0.0, 0.0, - step ) ) - sample1( coord + vec3( 0.0, 0.0, step ) );

          return normalize( vec3( x, y, z ) );
        }

        vec4 BlendUnder(vec4 color, vec4 newColor) {
          color.rgb += (1.0 - color.a) * newColor.a * newColor.rgb;
          color.a += (1.0 - color.a) * newColor.a;
          return color;
        }

        void main() {
          vec3 rayDir = normalize(v_direction);
          vec2 bounds = hitBox(v_origin, rayDir);
          if (bounds.x > bounds.y) discard;

          bounds.x = max(bounds.x, 0.0);

          vec3 p = v_origin + bounds.x * rayDir;
          vec3 inc = 1.0 / abs(rayDir);
          float delta = min(inc.x, min(inc.y, inc.z));
          delta /= steps;

          for (float t = bounds.x; t < bounds.y; t += delta) {
            vec4 samplerColor = sample2(p + 0.5);
            samplerColor.a *= .02;
            color = BlendUnder(color, samplerColor);

            p += rayDir * delta;
          }


          if ( color.a == 0.0 ) discard;
        }
          `,
            side: THREE.BackSide,
            transparent: true,
          });
          //Initialize internal object3d
          // https://github.com/maptalks/maptalks.three/blob/1e45f5238f500225ada1deb09b8bab18c1b52cf2/src/BaseObject.js#L140
          this._createMesh(geometry, material);

          //set object3d position
          const z = layer.altitudeToVector3(altitude, altitude).x;
          const position = layer.coordinateToVector3(coordinate, z);
          this.getObject3d().position.copy(position);
          this.getObject3d().scale.x = 10000
          this.getObject3d().scale.y = 10000
          this.getObject3d().scale.z = 1000
        }

        /**
         * animateShow test
         */
        animateShow(options = {}, cb) {
          if (this._showPlayer) {
            this._showPlayer.cancel();
          }
          if (maptalks.Util.isFunction(options)) {
            options = {};
            cb = options;
          }
          const duration = options['duration'] || 1000,
            easing = options['easing'] || 'out';
          const player = (this._showPlayer = maptalks.animation.Animation.animate(
            {
              scale: 1,
            },
            {
              duration: duration,
              easing: easing,
            },
            (frame) => {
              const scale = frame.styles.scale;
              if (scale > 0) {
                this.getObject3d().scale.set(scale, scale, scale);
              }
              if (cb) {
                cb(frame, scale);
              }
            },
          ));
          player.play();
          return player;
        }
      }

      const init = (data) => {
        // Texture
        const cols = data.cols;
        const rows = data.rows;
        const heights = data.heights;
        let xmax = data.xmax;
        let xmin = data.xmin;
        let ymax = data.ymax;
        let ymin = data.ymin;
        let zmax = data.zmax;
        let zmin = data.zmin;
        const values = data.values;

        const colors = [
          [0, 0, 0, 0],
          [170, 36, 250, 1],
          [212, 142, 254, 1],
          [238, 2, 48, 1],
          [254, 100, 92, 1],
          [254, 172, 172, 1],
          [140, 140, 0, 0.9],
          [200, 200, 2, 0.8],
          [252, 244, 100, 0.7],
          [16, 146, 26, 0.6],
          [0, 234, 0, 0.5],
          [166, 252, 168, 0.4],
          [30, 38, 208, 0.3],
          [122, 114, 238, 0.2],
          [192, 192, 254, 1],
        ];

        const steps = [0, 5, 10, 15, 20, 25, 30, 35, 40, 45, 50, 55, 60, 65];
        const resolution = new THREE.Vector3(cols, rows, heights);
        const rgbVoxelArray = new Float32Array(resolution.x * resolution.y * resolution.z * 4);

        for (let z = 0; z < resolution.z; z++) {
          const zOffset = z * resolution.x * resolution.y;
          for (let y = 0; y < resolution.y; y++) {
            const yOffset = y * resolution.x;
            for (let x = 0; x < resolution.x; x++) {
              const index = x + yOffset + zOffset;

              const val = values[index];
              if (val != null) {
                let xcolor = colors[0];
                for (let i = 0; i < steps.length; i++) {
                  if (val < 0) {
                    xcolor = colors[0];
                    break;
                  }
                  if (val < steps[i]) {
                    xcolor = colors[i];
                    // xcolor=colors[i-1];
                    break;
                  }
                }
                rgbVoxelArray[4 * index] = xcolor[0] / 255;
                rgbVoxelArray[4 * index + 1] = xcolor[1] / 255;
                rgbVoxelArray[4 * index + 2] = xcolor[2] / 255;
                rgbVoxelArray[4 * index + 3] = xcolor[3];
              }
            }
          }
        }

        const layer = new maptalks.ThreeLayer('volume', {
          forceRenderOnMoving: true,
          forceRenderOnRotating: true,
        });

        let stats;
        layer.prepareToDraw = function (gl, scene, camera) {

          camera.near = 0.00001;
          camera.far = 10000000;
          camera.fov = 3;
          console.log(camera)
          stats = new Stats();
          stats.domElement.style.zIndex = 100;
          document.getElementById('map').appendChild(stats.domElement);

          // var light = new THREE.DirectionalLight(0xffffff);
          // light.position.set(0, -10, 10).normalize();
          // scene.add(light);
          // scene.add(new THREE.AmbientLight(0xffffff, 0.5));

          const volume = new Volume(
            {
              coordinate: [xmin + (xmax - xmin) / 2, ymin + (ymax - ymin) / 2],
              resolution,
              data: rgbVoxelArray,
              // altitude: zmin + (zmax - zmin) / 2,
              altitude: 0,
            },
            {},
            layer,
          );

          layer.addMesh(volume);
        };

        const sceneConfig = {
          postProcess: {
            enable: true,
            antialias: { enable: true },
          },
        };
        const groupLayer = new maptalks.GroupGLLayer('group', [layer], { sceneConfig });
        groupLayer.addTo(map);
        animation();

        function animation() {
          if (stats) {
            stats.update();
          }
          requestAnimationFrame(animation);
        }
      };

      fetch('https://sakitam.oss-cn-beijing.aliyuncs.com/codepen/assets/image/data.zip')
        .then((res) => res.arrayBuffer())
        .then(async (data) => {
          const zip = new JSZip();
          const zipFile = await zip.loadAsync(data);
          const file = await zipFile.file('data.json');
          const json = await file?.async('string');
          init(JSON.parse(json));
        });
    </script>
  </body>
</html>
